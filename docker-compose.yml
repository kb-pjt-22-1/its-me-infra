services:

  # nginx 이미지
  nginx:
    image: jonasal/nginx-certbot:latest
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_secrets:/etc/letsencrypt
      # nginx-certbot 이미지가 user_conf.d의 server_name을 읽어 인증서 발급 도메인을 정한다
      - ./nginx/benepay.conf:/etc/nginx/user_conf.d/benepay.conf:ro
    depends_on:
      - backend
      - frontend

  # 로컬 전용 (TLS 없음). benepay.site 실제 인증서가 없는 로컬 환경에서
  # 운영용 nginx 대신 backend/frontend를 라우팅합니다.
  #   docker compose --profile local up -d
  #   접속: http://localhost:8080  (/api/* -> backend, 그 외 -> frontend)
  local-nginx:
    image: nginx:alpine
    profiles: [ "local" ]
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    image: ghcr.io/kb-pjt-22-1/its-me-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      PORTONE_IMP_KEY: ${PORTONE_IMP_KEY}
      PORTONE_IMP_SECRET: ${PORTONE_IMP_SECRET}
      DI_HASH_SALT: ${DI_HASH_SALT}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
      # card-mock의 호스트 노출 포트는 없고(외부에 노출할 이유가 없는 내부 전용 서비스),
      # 같은 컴포즈 네트워크 안이라 서비스명:컨테이너 포트(8080)로 접근한다.
      KB_CARD_BASE_URL: http://card-mock:8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/kb-pjt-22-1/its-me-frontend:${FRONTEND_IMAGE_TAG:-latest}
    restart: unless-stopped

  # KB 카드사 목 서버. backend의 회원가입 본인확인/카드 자동연동(KbCardClient)이 호출하는
  # 대상이며, 외부에 노출할 이유가 없어 호스트 포트는 열지 않는다(디버깅용 직접 접근이
  # 필요하면 로컬의 docker-compose.local.yml처럼 ports를 추가하면 된다).
  card-mock:
    image: ghcr.io/kb-pjt-22-1/its-me-card-mock:${CARD_MOCK_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: kb_card_mock
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # 컨테이너 네트워크 안에서 backend로 가려면 localhost가 아니라 서비스명으로 접근해야 한다
      BENEPAY_BASE_URL: http://backend:8080
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      # 기본 포트(3306)를 그대로 안 쓰고 secret으로 관리 — 자동 스캔 노출 최소화
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  nginx_secrets:
