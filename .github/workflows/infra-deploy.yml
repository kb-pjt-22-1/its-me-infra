name: Deploy Infra Services (nginx/mysql/redis)

# 이 레포(nginx 설정, mysql/init, docker-compose.yml)가 main에 push되면
# infra가 담당하는 서비스만 자동으로 재배포한다. backend/frontend/card-mock 컨테이너는
# 건드리지 않는다(그건 각 앱 레포의 main push -> repository_dispatch가 담당, deploy.yml 참고).
#
# 주의: 01_schema.sql/03_mock_schema.sql이 각각 DROP DATABASE IF EXISTS로 시작하기 때문에,
# benepay와 kb_card_mock DB는 각자 관련 파일이 바뀔 때마다 통째로 지우고 스키마+목데이터를
# 다시 만든다. 목데이터 단계에서만 쓰는 방식이며, 실 사용자 데이터가 쌓이면 증분 마이그레이션으로
# 바꿔야 한다. 두 DB는 서로 다른 파일(01/02 vs 03/04)에 매여 있어서, 한쪽만 바뀌어도 아래
# paths-filter가 그 DB만 골라서 재적용한다 - benepay 변경이 kb_card_mock을, 혹은 그 반대를
# 잘못 건드리는 일은 없다.
on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - nginx/**
      - mysql/init/**
      - .github/workflows/infra-deploy.yml
  workflow_dispatch:
    inputs:
      force:
        description: "paths-filter 결과 무시하고 mysql(SQL 재적용 포함)/redis/nginx 전부 강제 재배포"
        type: boolean
        default: false

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 이 워크플로우는 docker-compose.yml/nginx/**/mysql/init/** 중 하나만 바뀌어도 실행되므로,
      # 각 서비스 재배포는 그 서비스와 관련된 경로가 이 push에서 실제로 바뀐 경우에만 돌게 막는다.
      # redis는 전용 파일이 없어서 docker-compose.yml 변경 여부로만 판단한다(오탐 가능, 미탐은 없음).
      - name: Detect which services changed
        id: changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          # 머지 커밋으로 push되면 paths-filter가 기본적으로 dev/main 브랜치를 직접
          # 비교하는데, 머지 직후엔 두 브랜치 트리가 이미 같아져서 diff가 항상 0으로
          # 나온다(= mysql/redis/nginx가 조용히 스킵됨). base를 이번 push 직전의
          # main SHA로 고정해서 "이 push로 실제로 뭐가 바뀌었는지"를 비교하게 한다.
          base: ${{ github.event.before }}
          filters: |
            benepay_sql:
              - 'mysql/init/01_schema.sql'
              - 'mysql/init/02_seed.sql'
            mock_sql:
              - 'mysql/init/03_mock_schema.sql'
              - 'mysql/init/04_mock_seed.sql'
            mysql_compose:
              - 'docker-compose.yml'
            nginx:
              - 'nginx/**'
              - 'docker-compose.yml'
            redis:
              - 'docker-compose.yml'

      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "docker-compose.yml,mysql/init/*,nginx/benepay.conf"
          target: ${{ secrets.EC2_APP_DIR }}

      - name: Redeploy nginx / mysql / redis
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD,MYSQL_ROOT_PASSWORD,MYSQL_PORT,REDIS_PORT,CERTBOT_EMAIL
          script: |
            set -e
            cd ${{ secrets.EC2_APP_DIR }}

            # redis: 상태 없는 캐시라 완전히 내렸다 올려도 안전.
            if [ "${{ steps.changes.outputs.redis == 'true' || inputs.force }}" = "true" ]; then
              echo "redis 관련 변경 감지 -> 재배포"
              docker compose --profile prod pull redis
              docker compose --profile prod down redis
              docker compose --profile prod up -d --wait redis
            else
              echo "redis 관련 변경 없음 -> 스킵"
            fi

            # mysql: docker-compose.yml의 mysql 설정(이미지 태그, 환경변수 등)이 바뀐 경우에만
            # redis/nginx처럼 down -> up으로 완전히 재기동한다. mysql-data는 named volume이라
            # down으로 컨테이너를 내려도 지워지지 않으므로 데이터는 그대로 유지된다
            # (데이터 초기화는 아래 SQL 재적용 단계가 별도로 담당).
            if [ "${{ steps.changes.outputs.mysql_compose == 'true' || inputs.force }}" = "true" ]; then
              echo "docker-compose.yml의 mysql 설정 변경 감지 -> 재배포"
              docker compose --profile prod pull mysql
              docker compose --profile prod down mysql
              docker compose --profile prod up -d --wait mysql
            else
              echo "docker-compose.yml의 mysql 설정 변경 없음 -> 컨테이너 기동만 보장"
              docker compose --profile prod up -d --wait mysql
            fi

            # SQL 재적용(DROP DATABASE 포함)은 각 DB에 관련된 파일이 이 push에서 실제로
            # 바뀐 경우에만, 그 DB만 골라서 실행한다. docker-entrypoint-initdb.d는 데이터
            # 볼륨이 비어있을 때 딱 한 번만 실행되므로, 스키마/시드 변경을 반영하려면 컨테이너가
            # 떠 있는 채로 직접 실행해야 한다.
            if [ "${{ steps.changes.outputs.benepay_sql == 'true' || inputs.force }}" = "true" ]; then
              echo "benepay 스키마/시드(01/02) 변경 감지 -> 재적용"
              docker compose exec -T -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql \
                mysql -uroot < mysql/init/01_schema.sql
              docker compose exec -T -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql \
                mysql -uroot < mysql/init/02_seed.sql
            else
              echo "benepay 스키마/시드 변경 없음 -> 재적용 스킵"
            fi

            # kb_card_mock은 benepay와 완전히 분리된 스키마/파일(03/04)이라, benepay 변경과
            # 무관하게 이 파일들이 바뀐 경우에만 독립적으로 재적용한다.
            if [ "${{ steps.changes.outputs.mock_sql == 'true' || inputs.force }}" = "true" ]; then
              echo "kb_card_mock 스키마/시드(03/04) 변경 감지 -> 재적용"
              docker compose exec -T -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql \
                mysql -uroot < mysql/init/03_mock_schema.sql
              docker compose exec -T -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql \
                mysql -uroot < mysql/init/04_mock_seed.sql
            else
              echo "kb_card_mock 스키마/시드 변경 없음 -> 재적용 스킵"
            fi

            # nginx: backend/frontend가 이미 떠 있어야 하는 의존관계라 마지막에 처리.
            # 바인드 마운트된 conf 파일 내용 변경은 compose가 자동 감지하지 못하므로 완전히 재기동한다.
            if [ "${{ steps.changes.outputs.nginx == 'true' || inputs.force }}" = "true" ]; then
              echo "nginx 관련 변경 감지 -> 재배포"
              docker compose --profile prod pull nginx
              docker compose --profile prod down nginx
              docker compose --profile prod up -d --wait nginx
            else
              echo "nginx 관련 변경 없음 -> 스킵"
            fi

            docker image prune -f
