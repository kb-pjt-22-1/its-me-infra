name: Deploy to EC2

# 트리거 방법 두 가지:
# 1) its-me-backend / its-me-frontend 의 배포 워크플로우가 이미지를 GHCR에 push한 뒤
#    repository_dispatch(type: deploy)로 이 워크플로우를 호출.
#    client_payload.service 에 자기 서비스명(backend | frontend)을 넘기면 그 컨테이너만 재배포된다.
# 2) 수동 배포가 필요할 때 Actions 탭에서 workflow_dispatch로 직접 실행
#    (service를 비우면 prod 스택 전체를 pull/재기동)
on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      service:
        description: "재배포할 서비스 (backend | frontend). 비우면 전체 스택"
        required: false
        default: ""
      image_tag:
        description: "its-me-backend 이미지 태그"
        required: false
        default: latest
      frontend_image_tag:
        description: "its-me-frontend 이미지 태그"
        required: false
        default: latest

# backend/frontend가 비슷한 시각에 main으로 머지되면 dispatch가 두 번 날아온다.
# 같은 EC2에 동시에 scp/docker compose가 실행되지 않도록 순차 처리한다
# (배포는 중간에 끊기면 곤란하므로 cancel-in-progress는 false).
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVICE: ${{ github.event.client_payload.service || inputs.service }}
      IMAGE_TAG: ${{ github.event.client_payload.image_tag || inputs.image_tag || 'latest' }}
      FRONTEND_IMAGE_TAG: ${{ github.event.client_payload.frontend_image_tag || inputs.frontend_image_tag || 'latest' }}
      # docker-compose.yml이 ${VAR} 치환으로 참조하는 값들. EC2에는 .env 파일을 두지 않고
      # 이 SSH 세션의 환경변수로만 주입한다 (아래 envs: 목록 참고).
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORTONE_IMP_KEY: ${{ secrets.PORTONE_IMP_KEY }}
      PORTONE_IMP_SECRET: ${{ secrets.PORTONE_IMP_SECRET }}
      DI_HASH_SALT: ${{ secrets.DI_HASH_SALT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate service input
        run: |
          case "$SERVICE" in
            ""|backend|frontend) ;;
            *) echo "::error::service는 backend 또는 frontend여야 합니다 (받은 값: $SERVICE)"; exit 1 ;;
          esac

      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "docker-compose.yml,mysql/init/*,nginx/benepay.conf"
          target: ${{ secrets.EC2_APP_DIR }}

      - name: Pull images & restart via docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: IMAGE_TAG,FRONTEND_IMAGE_TAG,SERVICE,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD,MYSQL_ROOT_PASSWORD,MYSQL_PORT,REDIS_PORT,CERTBOT_EMAIL,JWT_SECRET,PORTONE_IMP_KEY,PORTONE_IMP_SECRET,DI_HASH_SALT
          script: |
            set -e
            cd ${{ secrets.EC2_APP_DIR }}
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_ACTOR }} --password-stdin
            # $SERVICE는 의도적으로 따옴표 없이 둔다: 비어 있으면 인자가 사라져 전체 스택이 대상이 된다
            docker compose --profile prod pull $SERVICE
            docker compose --profile prod up -d $SERVICE
            docker image prune -f
