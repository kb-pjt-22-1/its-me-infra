server {
    listen 80;
    server_name _;

    # 도커 내장 DNS. proxy_pass에 호스트명을 직접 쓰면 nginx가 "기동 시 딱 한 번"만
    # 해석하기 때문에, 그 시점에 backend/frontend 컨테이너가 없으면
    #   nginx: [emerg] host not found in upstream "frontend"
    # 로 nginx 자체가 죽는다. dev-up.sh가 backend/frontend만 재빌드하는 사이에
    # nginx가 재시작을 시도하면 이 상황에 걸린다.
    # upstream을 변수로 넘기면 기동 시점에는 해석하지 않고 요청 시점에 해석하므로,
    # nginx가 죽지 않고 컨테이너 재생성으로 IP가 바뀌어도 10초 안에 따라간다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $web_upstream http://frontend:80;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
