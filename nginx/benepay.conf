server {
    listen 443 ssl default_server reuseport;
    listen [::]:443 ssl default_server reuseport;

    server_name benepay.site www.benepay.site;

    ssl_certificate         /etc/letsencrypt/live/benepay.site/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/benepay.site/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/benepay.site/chain.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    # 도커 내장 DNS. proxy_pass에 호스트명을 직접 쓰면 nginx가 "기동 시 딱 한 번"만
    # 해석하고 그 IP를 계속 물고 있는다. deploy.yml이 `up -d backend`로 컨테이너를
    # 재생성하면 IP가 바뀌는데 nginx는 옛 IP로 계속 붙어서 502가 영구히 남았다.
    # 아래처럼 upstream을 변수로 넘기면 요청 시점에 다시 해석되고, valid=10s 주기로
    # 캐시가 만료되므로 배포 후 최대 10초면 새 컨테이너를 따라간다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $web_upstream http://frontend:80;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
