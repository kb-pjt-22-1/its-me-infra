services:
  redis:
    image: redis:7.2                # redis 7.2 이미지
    container_name: benepay-redis   # 컨테이너 이름
    restart: unless-stopped         # 컨테이너 종료 시 재시작
    command: redis-server --requirepass ${REDIS_PASSWORD} # 비밀번호 인증 필수
    ports:
      - "${REDIS_PORT:-6379}:6379"  # 6379 포트 포워딩
    volumes:
      - redis-data:/data            # 데이터 저장 경로
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"] # 헬스 체크 명령어
      interval: 5s   # 5초마다 헬스 체크
      timeout: 5s    # 5초 동안 헬스 체크 실패하면 실패로 간주
      retries: 10    # 10번 실패하면 컨테이너 재시작

volumes:
  redis-data:
